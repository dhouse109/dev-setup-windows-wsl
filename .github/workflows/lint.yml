# Checks on every push and pull request. The scripts only run inside Debian 13 on WSL2 on the Windows
# laptops, so CI checks what can be checked anywhere: that bash can parse them, that ShellCheck finds no
# errors (warnings are left for the comments to explain), and that no secret got committed.
# Ported from dev-setup-chromebook v101's lint.yml. Only dev-*.sh at the repo root is linted;
# reference/ is a read-only copy of the Chromebook bundle, linted in its own repo. Until the forked
# scripts exist the shell steps find nothing and pass.
# Not ported yet: the Chromebook's one-version-number check (waits on the plan's numbering and script
# names), its release-archive and v101 regression tests (tests/ was not copied), and a PowerShell job
# (added with the Windows-host script).
name: lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no tracked symlinks
        # CLAUDE.md imports AGENTS.md instead of linking to it; Git for Windows often checks symlinks out
        # as plain text files, so none are tracked anywhere in the repo.
        run: |
          links=$(git ls-files -s | awk '$1 == "120000" { print $4 }')
          if [ -n "$links" ]; then echo "tracked symlinks:"; echo "$links"; exit 1; fi
      - name: bash -n
        run: |
          shopt -s nullglob
          files=(dev-*.sh)
          if [ ${#files[@]} -eq 0 ]; then echo "no dev-*.sh scripts at the repo root yet"; exit 0; fi
          for f in "${files[@]}"; do
            echo "bash -n $f"
            bash -n "$f"
          done
      - name: shellcheck (errors only)
        # ShellCheck comes preinstalled on GitHub's Ubuntu runners.
        run: |
          shopt -s nullglob
          files=(dev-*.sh)
          shellcheck --version
          if [ ${#files[@]} -eq 0 ]; then echo "no dev-*.sh scripts at the repo root yet"; exit 0; fi
          shellcheck -S error "${files[@]}"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
